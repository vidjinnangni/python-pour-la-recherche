name: python-pour-la-recherche
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # Environnement Jupyter
  - jupyterlab=4.6.3
  - notebook=7.2.2
  # Manipulation de données
  - pandas=3.0.5
  - numpy=2.5.2
  - openpyxl=3.1.5
  # Visualisation
  - matplotlib=3.11.1
  - seaborn=0.13.2
  - plotly=6.9.0
  # Statistiques et économétrie
  - scipy=1.18.0
  - statsmodels=0.14.6
  # Texte et scraping
  - beautifulsoup4=4.14.3
  - requests=2.34.2
  - nltk=3.10.3
  # Machine learning
  - scikit-learn=1.9.0
  # Pip pour les paquets absents ou incomplets sur conda-forge
  - pip
  - pip:
      - linearmodels==7.0
      - python-dotenv==1.2.2
