name: python-pour-la-recherche
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # Environnement Jupyter
  - "jupyterlab>=4.6.3,<5.0.0"
  - "notebook>=7.5.6,<8.0.0"
  # Manipulation de données
  - "pandas>=3.0.5,<4.0.0"
  - "numpy>=2.5.2,<3.0.0"
  - "openpyxl>=3.1.5,<4.0.0"
  # Visualisation
  - "matplotlib>=3.11.1,<4.0.0"
  - "seaborn>=0.13.2,<1.0.0"
  - "plotly>=6.9.0,<7.0.0"
  # Statistiques et économétrie
  - "scipy>=1.18.0,<2.0.0"
  - "statsmodels>=0.14.6,<1.0.0"
  # Texte et scraping
  - "beautifulsoup4>=4.14.3,<5.0.0"
  - "requests>=2.34.2,<3.0.0"
  - "nltk>=3.10.3,<4.0.0"
  # Machine learning
  - "scikit-learn>=1.9.0,<2.0.0"
  # Pip pour les paquets absents ou incomplets sur conda-forge
  - pip
  - pip:
      - "linearmodels>=7.0,<8.0"
      - "python-dotenv>=1.2.2,<2.0.0"
